# ───────────────────────────────────────────────────────────────
# Cloudflare DNS only(⚪ 직통) 구조 — 2026-11-26 전환. 롤백: /srv/nginx-proxy/bin/cf-dns.sh proxy <fqdn>
# 인증서: 공용 *.ghmate.com Let's Encrypt (snippets/ghmate-ssl.inc, 서버 cron 자동 갱신)
# $remote_addr 는 00-ghmate-common.conf 의 realip 로 경유·직통 모두 진짜 접속자 IP.
# 앱에 넘기는 CF-Connecting-IP / X-Forwarded-For 는 snippets/ghmate-proxy-headers.inc 가 $remote_addr 로 덮어쓴다
# (직통에서는 클라이언트가 CF-Connecting-IP 헤더를 위조할 수 있으므로 그 헤더 값을 제한 키로 쓰지 않는다).
#
# Rate limit — 백엔드 prod 전용 zone(엣지 방어, 앱 레벨 Flask-Limiter와 이중). 나머지는 공용 ghmate_req.
# ⚠️ zone 이름을 바꾸지 않고 키만 바꾸면 nginx -t 는 통과해도 reload 가 실패한다 → 키 변경 시 이름도 변경.
# ───────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=heyvoca_api_ip:10m rate=600r/m;

# ⚠️ 업스트림은 반드시 resolver + 변수 proxy_pass 로 지정한다(GHMATE_SERVER_GUIDE "nginx reload 안전 규칙").
# 컨테이너명을 proxy_pass에 문자열로 직접 쓰면 nginx가 reload 시점 IP를 캐시 →
# ①배포로 IP 바뀌면 reload 전까지 502, ②컨테이너가 죽으면 nginx -t 실패로 공용 reload 전체가 막힘.
# resolver(Docker DNS) + set $up 변수면 요청마다 재확인 → 죽어도 그 도메인만 런타임 502(남에겐 무해).

# ─── heyvoca dev ───
server {
    listen 80;
    server_name dev-heyvoca-front.ghmate.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev-heyvoca-front.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Vite dev 서버는 첫 화면에 모듈 수백 개를 동시에 요청 → 요청 수 제한은 걸지 않고 동시 연결만 제한
    limit_conn ghmate_conn 100;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / {
        set $up heyvoca_front_dev;
        proxy_pass http://$up:3000;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name dev-heyvoca-back.ghmate.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev-heyvoca-back.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req  zone=ghmate_req burst=200 nodelay;
    limit_conn ghmate_conn 100;
    add_header X-Content-Type-Options "nosniff" always;
    location / {
        set $up heyvoca_back_dev;
        proxy_pass http://$up:5000;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

# ─── heyvoca prod ───
server {
    listen 80;
    server_name heyvoca-front.ghmate.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name heyvoca-front.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req  zone=ghmate_req burst=200 nodelay;
    limit_conn ghmate_conn 100;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP는 우선 Report-Only(미적용). 콘솔 위반 로그로 안정 확인 후 enforce 전환.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://apis.google.com; connect-src 'self' https://*.ghmate.com wss://*.ghmate.com https://*.googleapis.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;" always;
    location / {
        set $up heyvoca_front_prod;
        proxy_pass http://$up:80;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
    }
}

server {
    listen 80;
    server_name heyvoca-back.ghmate.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name heyvoca-back.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_conn ghmate_conn 100;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / {
        limit_req zone=heyvoca_api_ip burst=50 nodelay;
        set $up heyvoca_back_prod;
        proxy_pass http://$up:5000;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

