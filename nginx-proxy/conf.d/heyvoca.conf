# ───────────────────────────────────────────────────────────────
# Rate limit zone (엣지 방어 — 앱 레벨 Flask-Limiter와 이중)
# 키: Cloudflare 실클라이언트 IP(CF-Connecting-IP), 없으면 remote_addr.
# rate는 정상 사용자가 닿지 않을 만큼 넉넉히 + burst nodelay로 순간 폭주 흡수.
# ───────────────────────────────────────────────────────────────
map $http_cf_connecting_ip $heyvoca_limit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $heyvoca_limit_key zone=heyvoca_api:10m rate=600r/m;

# ─── heyvoca dev ───
server {
    listen 80;
    listen 443 ssl;
    server_name dev-heyvoca-front.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / {
        proxy_pass http://heyvoca_front_dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name dev-heyvoca-back.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options "nosniff" always;
    location / {
        proxy_pass http://heyvoca_back_dev:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

