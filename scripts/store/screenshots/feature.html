<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family: P; src: local('Pretendard ExtraBold'), local('Pretendard-ExtraBold'); font-weight: 800; }
  @font-face { font-family: P; src: local('Pretendard Medium'), local('Pretendard-Medium'); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: P, sans-serif; position: relative;
    background: linear-gradient(120deg, #FFF3FB 0%, #FFE3F5 60%, #FFD0EE 100%); }
  .left { position: absolute; left: 80px; top: 120px; }
  .logo { height: 46px; margin-bottom: 28px; }
  h1 { font-weight: 800; font-size: 44px; line-height: 1.25; color: #111; letter-spacing: -1px; }
  h1 em { font-style: normal; color: #FF4FC6; }
  p { margin-top: 16px; font-weight: 500; font-size: 20px; color: #555; }
  .phone { position: absolute; right: 110px; top: 50px; width: 250px; height: 541px; border-radius: 42px; background: #1d1d1f; padding: 9px;
    box-shadow: 0 24px 48px rgba(255, 79, 198, .25); transform: rotate(-6deg); }
  .screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #fff; }
  .screen img { width: 100%; display: block; margin-top: 26px; }
</style></head>
<body>
  <div class="left">
    <img class="logo" src="logo_h.svg" alt="">
    <h1>단어를 심으면<br><em>기억이 자라요</em></h1>
    <p>당근 농장에서 키우는 영어·일본어 단어</p>
  </div>
  <div class="phone"><div class="screen"><img id="img"></div></div>
</body></html>
