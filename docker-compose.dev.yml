version: '3.8'

# ─── Dev 환경 ───
# 글로벌 nginx_proxy가 아래 두 도메인을 라우팅:
#   dev-heyvoca-front.ghmate.com → heyvoca_front_dev:3000
#   dev-heyvoca-back.ghmate.com  → heyvoca_back_dev:5000

services:
  front:
    container_name: heyvoca_front_dev
    image: heyvoca_front:dev
    build:
      context: ./heyvoca_front
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --mode dev
    environment:
      - VITE_ENV=development
    volumes:
      - ./heyvoca_front:/app
      - /app/node_modules
    networks:
      - heyvoca_dev
      - nginx_proxy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  back:
    container_name: heyvoca_back_dev
    image: heyvoca_back:dev
    build:
      context: ./heyvoca_back
      dockerfile: Dockerfile.dev
    command: gunicorn -w 1 --reload -b 0.0.0.0:5000 run:app
    env_file:
      - ./heyvoca_back/.env.dev
    volumes:
      - ./heyvoca_back:/app
      # 사전 DB 동기화: dict_sync.py와 dict_pointer.json을 백엔드 컨테이너에 노출
      - ./scripts:/app/scripts:ro
      - ./db/dict:/app/db/dict:ro
    networks:
      - heyvoca_dev
      - nginx_proxy
    # DB/Redis가 healthy 된 뒤 기동 → 정전 재부팅 시 mysql 미준비로 인한 부팅 실패/재시작 루프 방지
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      # ubuntu:20.04 베이스는 `python`이 없다 → 반드시 python3 (기존 python은 항상 실패해 unhealthy 오탐)
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  mysql:
    container_name: heyvoca_mysql_dev
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # MYSQL_DATABASE 제거: db/init/01_create_schemas.sql이 heyvoca_user + heyvoca_dict 자동 생성
      MYSQL_USER: ${MYSQL_USER:-voca}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_dev_data:/var/lib/mysql
      # 첫 기동 시 schema 자동 생성 (volume 비어 있을 때만 1회 실행)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - heyvoca_dev
    restart: always
    healthcheck:
      # ping은 인증 없이 서버 도달 여부만 확인(자격증명 불필요) → 비밀번호의 ! 이스케이프 이슈 없음
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  redis:
    container_name: heyvoca_redis_dev
    image: redis:latest
    networks:
      - heyvoca_dev
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  heyvoca_dev:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_dev_data:
