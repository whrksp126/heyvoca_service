server {
  listen 80;
  server_name _;

  # 정적 루트/인덱스 명시
  root  /usr/share/nginx/html;
  index index.html;

  # 배포마다 바뀌는 빌드 지문 — **절대 캐시 금지.** 열려 있던 탭이 자기가 낡았는지 판정하는 근거라,
  #  이게 캐시되면 영원히 낡은 값을 보고 새로고침이 걸리지 않는다(= 이 파일을 둔 이유가 사라진다).
  location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # 해시된 자원(= vite 가 만든 /assets/ 아래)만 강캐시한다.
  #  ⚠ **확장자로 판단하면 안 된다.** public/ 에서 그대로 복사되는 파일(dummy_vocalist/*.json, vite.svg)은
  #    파일명에 해시가 없어서, 확장자 기준으로 immutable 을 걸면 내용을 바꿔 배포해도 사용자 브라우저가
  #    1년 동안 옛 파일을 쓴다. 경로로 나누는 것이 유일하게 안전한 기준이다.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # 해시 없는 정적 파일(public/) — 캐시는 짧게, 그리고 **없으면 정직하게 404**.
  #  ⚠ 이 규칙이 없으면 아래 SPA 규칙으로 흘러가 배포로 사라진 자산 요청에 **index.html 을 200 으로**
  #    돌려준다. 그러면 sql.js 는 wasm 대신 HTML 을 받고 폰트는 디코드에 실패하는 등,
  #    "파일이 없다" 가 아니라 원인 모를 에러로 나타난다.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|eot|wasm|mp3|mp4|json|lottie)$ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # index.html 자체는 캐시 금지 (배포 즉시 반영)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # SPA 라우팅: 실제 파일/폴더 없으면 index.html
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ /index.html;
  }

  # (중요) 에러페이지로 index.html을 지정하지 마세요. 루프 위험
  # error_page 404 /index.html;  # ← 사용하지 않음

  # (선택) gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/octet-stream image/svg+xml;
  gzip_min_length 1024;
}



