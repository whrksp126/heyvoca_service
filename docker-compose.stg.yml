version: '3.8'

# ─── Staging 환경 ───
# nginx가 아래 두 도메인을 라우팅:
#   stg-heyvoca-front.ghmate.com → front:80
#   stg-heyvoca-back.ghmate.com  → back:5000

services:
  front:
    container_name: heyvoca_front_stg
    image: heyvoca_front:stg
    build:
      context: ./heyvoca_front
      dockerfile: Dockerfile.stg
      args:
        VITE_BACKEND_URL: https://stg-heyvoca-back.ghmate.com
        VITE_DEBUG: "false"
        VITE_ENV: staging
        NODE_ENV: staging
    networks:
      - heyvoca_stg
      - nginx_proxy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  back:
    container_name: heyvoca_back_stg
    image: heyvoca_back:stg
    build:
      context: ./heyvoca_back
      dockerfile: Dockerfile.stg
    env_file:
      - ./heyvoca_back/.env.stg
    volumes:
      # 사전 DB 동기화: dict_sync.py와 dict_pointer.json을 백엔드 컨테이너에 노출
      - ./scripts:/app/scripts:ro
      - ./db/dict:/app/db/dict:ro
    networks:
      - heyvoca_stg
      - nginx_proxy
    # DB/Redis가 healthy 된 뒤 기동 → 정전 재부팅 시 mysql 미준비로 인한 부팅 실패/재시작 루프 방지
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      # ubuntu:20.04 베이스는 `python`이 없다 → 반드시 python3 (기존 python은 항상 실패해 unhealthy 오탐)
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

  mysql:
    container_name: heyvoca_mysql_stg
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # MYSQL_DATABASE 제거: db/init/01_create_schemas.sql이 heyvoca_user + heyvoca_dict 자동 생성
      MYSQL_USER: ${MYSQL_USER:-voca}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_stg_data:/var/lib/mysql
      # 첫 기동 시 schema 자동 생성 (volume 비어 있을 때만 1회 실행)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - heyvoca_stg
    restart: always
    healthcheck:
      # ping은 인증 없이 서버 도달 여부만 확인(자격증명 불필요) → 비밀번호의 ! 이스케이프 이슈 없음
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  redis:
    container_name: heyvoca_redis_stg
    image: redis:latest
    networks:
      - heyvoca_stg
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  heyvoca_stg:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_stg_data:
